  <script>
    (function () {
      var link = document.getElementById("email-link");
      var toast = document.getElementById("email-toast");
      var timer;

      function addr() {
        var u = "lostrows";
        var d = "health.ucsd.edu";
        return u + "@" + d;
      }

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("show");
        clearTimeout(timer);
        timer = setTimeout(function () { toast.classList.remove("show"); }, 3000);
      }

      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "absolute";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
      }

      link.addEventListener("click", function (e) {
        e.preventDefault();
        var a = addr();

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(a).then(
            function () { showToast("Copied: " + a); },
            function () { showToast(fallbackCopy(a) ? "Copied: " + a : a); }
          );
        } else {
          showToast(fallbackCopy(a) ? "Copied: " + a : a);
        }

        window.location.href = "mailto:" + a;
      });
    })();
  </script>
